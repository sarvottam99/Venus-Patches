name: Build Venus Patches

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show tool versions
        run: |
          python --version
          node --version
          java -version

      - name: Build and test patches
        run: python3 scripts/build.py

      - name: Upload MPP artifact
        uses: actions/upload-artifact@v4
        with:
          name: venus-patches-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 30
        - name: Publish release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: v1.8.2
            name: Venus Patches v1.8.2
            files: patches/build/libs/patches-1.8.2.mpp
            generate_release_notes: true
